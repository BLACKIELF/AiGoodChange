name: AiGoodChange CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS build and checks
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and runner
        run: |
          test "$(uname -m)" = arm64
          git diff --check
          bash -n build.sh selfcheck.sh package.sh
      - name: Build and run checks
        run: bash selfcheck.sh
      - name: Build release package
        run: bash package.sh
      - name: Verify release contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import subprocess
          import zipfile

          version = Path("VERSION").read_text().strip()
          archive = Path("build/package") / f"AiGoodChange-{version}-macOS-arm64.zip"
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None, "Damaged archive"
              info = plistlib.loads(package.read("AiGoodChange.app/Contents/Info.plist"))
              assert info["CFBundleShortVersionString"] == version
              assert info["CFBundleIdentifier"] == "com.quicktoggle.app"
              revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              assert info["QuickToggleSourceRevision"] == revision
          print(f"Verified AiGoodChange {version} release archive")
          PY

  windows:
    name: Windows ${{ matrix.runtime }} build and checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-vs2026-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Check source
        run: git diff --check
      - name: Build, run native checks and package
        shell: pwsh
        run: ./windows/build.ps1 -Runtime ${{ matrix.runtime }} -Package
      - name: Upload packages and UI checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: QuickToggle-${{ matrix.runtime }}
          path: |
            build/windows/${{ matrix.runtime }}/*.zip
            build/windows/${{ matrix.runtime }}/SHA256SUMS-*.txt
            build/windows/${{ matrix.runtime }}/checks/*.png
          if-no-files-found: error
          retention-days: 14
